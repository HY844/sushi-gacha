<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寿司ガチャ</title>
  <style>
    :root {
      --primary-color: #d9333f;
      --gold-color: #d4af37;
      --bg-color: #f4f1ea;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", MeiYo, sans-serif;
      text-align: center;
      background-color: var(--bg-color);
      background-image: radial-gradient(#e2ded4 1px, transparent 1px);
      background-size: 16px 16px;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
    }

    .card {
      background: #ffffff;
      border: 3px solid var(--gold-color);
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 360px;
      width: 100%;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.4rem;
      color: #333;
      margin-top: 0;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .result-box {
      background: #fafafa;
      border: 2px solid #eee;
      border-radius: 12px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
      padding: 15px;
      position: relative;
    }

    .category {
      font-size: 0.85rem;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: inline-block;
    }

    /* カテゴリーごとの色分け */
    .cat-寿司 { background: #ffebee; color: #c62828; }
    .cat-サイドメニュー { background: #e8f5e9; color: #2e7d32; }
    .cat-デザート { background: #fce4ec; color: #ad1457; }
    .cat-ドリンク { background: #e3f2fd; color: #1565c0; }
    .cat-default { background: #eee; color: #666; }

    .menu-name {
      font-size: 1.5rem;
      font-weight: bold;
      color: #222;
      margin: 5px 0;
      line-height: 1.3;
    }

    .roulette-anim {
      animation: pulse 0.1s infinite alternate;
      color: #888;
    }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }

    .btn-draw {
      background: linear-gradient(135deg, #e60012, #aa000d);
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 6px 15px rgba(230,0,18,0.3);
      transition: all 0.2s ease;
    }

    .btn-draw:active {
      transform: translateY(2px);
      box-shadow: 0 2px 5px rgba(230,0,18,0.3);
    }

    .btn-draw:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🍣 寿司ガチャ 🍣</h1>
    
    <div class="result-box" id="resultBox">
      <div id="statusText" style="color: #666;">ボタンを押してガチャを回そう！</div>
    </div>

    <button class="btn-draw" id="drawBtn" onclick="startGacha()">次になに食べる？</button>
  </div>

  <script>
    let menus = [];
    let isSpinning = false;

    // menu.json を読み込む
    fetch('menu.json')
      .then(response => response.json())
      .then(data => {
        menus = data;
      })
      .catch(error => {
        console.error('データの読み込みに失敗しました:', error);
        document.getElementById("resultBox").innerHTML = '<div style="color:red;">データ読み込みエラー</div>';
      });

    // カテゴリーに応じたスタイルクラスを返す関数
    function getCategoryClass(cat) {
      if (['寿司', 'サイドメニュー', 'デザート', 'ドリンク'].includes(cat)) {
        return `cat-${cat}`;
      }
      return 'cat-default';
    }

    function startGacha() {
      if (menus.length === 0 || isSpinning) return;
      
      isSpinning = true;
      const btn = document.getElementById("drawBtn");
      const resultBox = document.getElementById("resultBox");
      btn.disabled = true;

      let counter = 0;
      const maxCount = 15; // ルーレットの回転回数
      const speed = 70;    // 切り替え速度(ms)

      const timer = setInterval(() => {
        const tempItem = menus[Math.floor(Math.random() * menus.length)];
        const catClass = getCategoryClass(tempItem.category);

        resultBox.innerHTML = `
          <div class="category ${catClass}">${tempItem.category}</div>
          <div class="menu-name roulette-anim">${tempItem.name}</div>
        `;
        counter++;

        if (counter >= maxCount) {
          clearInterval(timer);
          // 確定演出
          const finalItem = menus[Math.floor(Math.random() * menus.length)];
          const finalCatClass = getCategoryClass(finalItem.category);

          resultBox.innerHTML = `
            <div class="category ${finalCatClass}">${finalItem.category}</div>
            <div class="menu-name" style="color: var(--primary-color);">${finalItem.name}</div>
          `;
          btn.disabled = false;
          btn.textContent = "もう一皿引く！";
          isSpinning = false;
        }
      }, speed);
    }
  </script>

</body>
</html>
